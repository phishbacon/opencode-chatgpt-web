name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime_asset: codex-chatgpt-web-darwin-arm64.tar.gz
          - runner: macos-15-intel
            runtime_asset: codex-chatgpt-web-darwin-amd64.tar.gz
          - runner: ubuntu-latest
            runtime_asset: codex-chatgpt-web-linux-amd64.tar.gz
          - runner: ubuntu-24.04-arm
            runtime_asset: codex-chatgpt-web-linux-arm64.tar.gz
          - runner: windows-latest
            runtime_asset: codex-chatgpt-web-windows-amd64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV
      - name: Prepare compatible Linux libnotify
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        if: runner.os == 'Linux'
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify
      - run: bun run app:package
      - name: Verify Linux AppImage ABI on current Arch
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke
      - name: Verify embedded macOS runtime signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict launcher/build/runtime/runtime/bun
      - name: Verify packaged macOS application signature
        if: runner.os == 'macOS'
        run: |
          archive="$(find launcher/artifacts -maxdepth 1 -name '*-mac-*.zip' -print -quit)"
          test -n "$archive"
          stage="$(mktemp -d)"
          ditto -x -k "$archive" "$stage"
          codesign --verify --deep --strict --verbose=2 "$stage/OpenCode ChatGPT Web.app"
      - name: Archive runtime
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.runtime_asset }}" -C launcher/build/runtime .
      - name: Archive Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath "${{ matrix.runtime_asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            ${{ matrix.runtime_asset }}
            launcher/artifacts/*.dmg
            launcher/artifacts/*.zip
            launcher/artifacts/*.exe
            launcher/artifacts/*.AppImage
          if-no-files-found: error

  container:
    name: Publish browser container
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.title=OpenCode ChatGPT Web browser container" \
            --label "org.opencontainers.image.description=Electron ChatGPT browser, Responses bridge, turn broker, tunnel-client and website MCP with Xvnc/noVNC for interactive login" \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            .
      # The published image must carry the whole noVNC login stack: Xvnc,
      # websockify, the noVNC web client, env-driven VNC auth, the loopback
      # bridge relay and a booting Electron. Prove every piece before push.
      - name: Smoke-test the noVNC setup inside the image
        run: |
          set -euo pipefail
          mkdir -p ci-secrets
          printf 'ci-dummy-turn-signing-key\n' > ci-secrets/turn-signing.key
          printf 'ci-dummy-tunnel-runtime-key\n' > ci-secrets/tunnel-runtime.key
          docker run -d --name novnc-smoke \
            -e VNC_PASSWORD="ci-smoke-pass" \
            -e TUNNEL_ID="tunnel_ci_smoke_00000000000000000000000000" \
            -v "$PWD/ci-secrets/turn-signing.key:/run/secrets/turn-signing.key:ro" \
            -v "$PWD/ci-secrets/tunnel-runtime.key:/run/secrets/tunnel-runtime.key:ro" \
            -p 127.0.0.1:18086:6080 \
            "${IMAGE}:${GITHUB_REF_NAME}" >/dev/null
          ok=""
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18086/vnc.html > novnc-page.html; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok"
          grep -qi "noVNC" novnc-page.html
          # A static asset beyond the page itself, so the client can actually run.
          curl -fsS http://127.0.0.1:18086/core/rfb.js > /dev/null || curl -fsS http://127.0.0.1:18086/core/ui.js > /dev/null
          docker exec novnc-smoke sh -c 'command -v Xvnc >/dev/null && command -v websockify >/dev/null && pgrep -f "electron .*--no-sandbox" >/dev/null && pgrep socat >/dev/null'
          docker logs novnc-smoke 2>&1 | grep -q "noVNC authentication uses VNC_PASSWORD"
          docker rm -f novnc-smoke >/dev/null
      - name: Push image
        run: |
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          # Prerelease tags (v1.2.3-rc1) never move the rolling latest tag.
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            docker tag "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run licenses
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release tag matches package version
        run: |
          expected="v$(jq -r .version package.json)"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Add licenses and installers
        run: |
          cp LICENSE release-assets/LICENSE
          cp LICENSES/Bun-1.4.0.md release-assets/Bun-1.4.0.md
          cp LICENSES/libnotify-0.8.7-LGPL-2.1.md release-assets/libnotify-0.8.7-LGPL-2.1.md
          cp dist/THIRD_PARTY_NOTICES.txt release-assets/THIRD_PARTY_NOTICES.txt
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install-launcher.sh release-assets/install-launcher.sh
          cp scripts/install-launcher.ps1 release-assets/install-launcher.ps1
      - name: Flatten release assets
        run: |
          cd release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "$name" ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            mv "$file" "$name"
          done < <(find . -mindepth 2 -type f -print0 | sort -z)
          find . -mindepth 1 -type d -empty -delete
      - name: Create checksums
        run: |
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$checksum_file"
          mv "$checksum_file" checksums.txt
      - name: Verify every built asset is checksummed
        run: |
          cd release-assets
          missing=""
          while IFS= read -r -d '' file; do
            name="${file#./}"
            if [ "$name" = checksums.txt ]; then continue; fi
            if ! awk -v asset="$name" '$2 == asset { found = 1 } END { exit found ? 0 : 1 }' checksums.txt; then
              missing="$missing $name"
            fi
          done < <(find . -type f -print0)
          if [ -n "$missing" ]; then
            echo "checksums.txt is missing entries for:$missing" >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          test "${#release_files[@]}" -gt 0
          release_flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if existing_release="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease 2>/dev/null)"; then
            # A maintainer can stage a final-version tag as a public preview before building it.
            # Rebuilding its assets must not silently promote that release to old launchers.
            if jq -e '.isPrerelease == true' <<< "$existing_release" >/dev/null; then
              release_flags=(--prerelease --latest=false)
            else
              release_flags=(--prerelease=false --latest)
            fi
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              "${release_flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              "${release_flags[@]}" \
              --generate-notes
          fi

          published_manifest="$(mktemp)"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name != "checksums.txt") | [.name, .digest] | @tsv' \
            | while IFS=$'\t' read -r name digest; do
                if [[ "$digest" != sha256:* || -z "${digest#sha256:}" ]]; then
                  echo "Published asset has no SHA-256 digest: $name" >&2
                  exit 1
                fi
                printf '%s  %s\n' "${digest#sha256:}" "$name"
              done \
            | LC_ALL=C sort -k2 > "$published_manifest"
          test -s "$published_manifest"
          mv "$published_manifest" release-assets/checksums.txt
          gh release upload "$GITHUB_REF_NAME" release-assets/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          while IFS=$'\t' read -r name digest; do
            if [ "$name" = checksums.txt ]; then continue; fi
            expected="$(awk -v asset="$name" '$2 == asset { print $1 }' release-assets/checksums.txt)"
            if [ -z "$expected" ] || [ "sha256:$expected" != "$digest" ]; then
              echo "Published asset checksum mismatch: $name" >&2
              exit 1
            fi
          done < <(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv')

          local_manifest_digest="$(sha256sum release-assets/checksums.txt | awk '{ print $1 }')"
          remote_manifest_digest="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name == "checksums.txt") | .digest')"
          test "sha256:$local_manifest_digest" = "$remote_manifest_digest"
